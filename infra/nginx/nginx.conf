# Minimal nginx config for the web pod.
# Read-only root FS — only /var/cache/nginx and /tmp are writable (mounted
# emptyDir by the helm chart).

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Writable paths inside the read-only FS — match the volumeMounts in the
  # helm chart values.
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  log_format json escape=json
    '{"time":"$time_iso8601","remote_ip":"$remote_addr","method":"$request_method","path":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  # NOTE: on-the-fly gzip runs AFTER sub_filter in nginx's filter chain, so
  # the __PUBLIC_ORIGIN__ substitution keeps working. Do NOT add
  # `gzip_static` / pre-compressed HTML — those bypass sub_filter and leak
  # the placeholder to clients.
  gzip on;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

  # Site config is rendered at container start by our entrypoint
  # (infra/nginx/entrypoint.sh): it substitutes ${SELF_ORIGIN} and the CSP
  # header into default.conf.template and writes the result here —
  # /etc/nginx/conf.d is read-only in the pod, /var/cache/nginx is the
  # only writable mount.
  include /var/cache/nginx/conf.d/*.conf;
}
