name: "[K8S] Build and push staking-widget to staging"

run-name: "[K8S] Build and push staking-widget:staging to staging"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'test/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@main
    with:
      target: staging
      harbor_project: team-si
      image: staking-widget
      # dockerfile: path/to/Dockerfile
    secrets: inherit
