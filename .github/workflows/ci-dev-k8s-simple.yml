name: Build and push staking-widget web+api to dev (feature/simple)

run-name: Build and push staking-widget-{web,api}:dev to Harbor

# Builds BOTH images of the Vite+Fastify stack and pushes them to the
# Harbor repos the `staking-widget` helm chart / ArgoCD Image Updater
# watch. NOTE: the simple-staking-widget (PoC) repo used the same repos —
# its workflows must stay disabled so two sources don't overwrite each
# other's :dev tag.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/simple
    paths-ignore:
      - '.github/**'
      - 'test/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build-and-push:
    strategy:
      matrix:
        include:
          - image: team-si/staking-widget-web
            dockerfile: Dockerfile.web
          - image: team-si/staking-widget-api
            dockerfile: Dockerfile.api
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@c7b5b6c5d8013046347d728d748fa741eb214e28
    with:
      tag: dev
      registry: registry.dev.k8s-dev.org
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      image: ${{ matrix.image }}
      environment: harbor_dev_release
      dockerfile: ${{ matrix.dockerfile }}
    secrets:
      registry_token: ${{ secrets.HARBOR_DEV_TOKEN }}
