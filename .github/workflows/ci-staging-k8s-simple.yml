name: Build and push staking-widget web+api to staging (feature/simple)

run-name: Build and push staking-widget-{web,api}:staging to Harbor

# Builds BOTH images of the Vite+Fastify stack and pushes them to the
# Harbor repos the `staking-widget` helm chart / ArgoCD Image Updater
# watch. NOTE: the simple-staking-widget (PoC) repo used the same repos —
# its workflows must stay disabled so two sources don't overwrite each
# other's :staging tag.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/simple
    paths-ignore:
      - '.github/**'
      - 'test/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build-and-push:
    strategy:
      matrix:
        include:
          - image: staking-widget-web
            dockerfile: Dockerfile.web
          - image: staking-widget-api
            dockerfile: Dockerfile.api
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@main
    with:
      target: staging
      harbor_project: team-si
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
    secrets: inherit
