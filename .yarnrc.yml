# Use the classic node_modules layout instead of Yarn PnP — Next.js 12,
# webpack loaders and the rest of the toolchain expect real node_modules.
nodeLinker: node-modules

# Allow dependencies to run their install/build scripts; native modules
# (bufferutil, utf-8-validate, keccak, unrs-resolver) need this to compile.
enableScripts: true

# Supply-chain guard: refuse package versions published to npm less than
# 480 minutes (8 hours) ago, giving the ecosystem time to detect and yank
# compromised releases. Only affects new resolutions, not the lockfile.
npmMinimalAgeGate: 480
